# phm_detectors parameters for an onboard run on a Unitree GO2 (its onboard computer).
# The watched topics are the robot's own state streams plus the shadow policy's
# latent. Rates measured on this robot: /lowstate 500 Hz, /sportmodestate ~295 Hz,
# /utlidar/imu ~248 Hz, /utlidar/cloud ~15 Hz; /policy/embedding is 50 Hz.
/**:
  ros__parameters:
    freq_topics:
      - /lowstate
      - /sportmodestate
      - /utlidar/imu
      - /utlidar/cloud
      - /policy/embedding
    freq_tolerance_percent: 20.0
    freq_min_consecutive: 2
    threshold_cpu_limit: 80.0
    threshold_mem_limit: 85.0
    threshold_temp_limit: 85.0
    threshold_min_consecutive: 2
    dead_timeout_sec: 2.0
    # Every onboard session checked (2026-10-06, and five on 2026-10-17) logged
    # dead-topic alerts on 2 to 5 topics exactly 2 s after startup. In the
    # three 10-17 sessions analysed those alerts reached /phm/health as non-OK
    # states (INTERVENE in one) while the topics were flowing (in that one,
    # /lowstate has no recorded gap over 0.04 s): DDS discovery took 2 to 3 s
    # before the first message arrived. The grace, inside the session's 12 s
    # settle, holds back dead verdicts for topics not seen yet; a topic that
    # never arrives is still dead after it.
    dead_startup_grace_sec: 5.0
    dead_topics:
      - /lowstate
      - /sportmodestate
      - /utlidar/imu
      - /utlidar/cloud
      - /policy/embedding
