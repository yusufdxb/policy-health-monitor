name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  standalone:
    name: C++ library, tools, benchmark, demo (no ROS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ zlib1g-dev libeigen3-dev libgtest-dev
      - name: Public repository hygiene
        run: scripts/check_public_hygiene.sh
      - name: No project Python
        run: scripts/check_no_project_python.sh
      - name: Configure and build the standalone superbuild
        run: |
          cmake -S standalone -B build/standalone -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/standalone
      - name: Tests (CTest)
        run: ctest --test-dir build/standalone --output-on-failure
      - name: Installed phm_core is usable through find_package
        run: |
          cmake --install build/standalone/phm_core --prefix "$RUNNER_TEMP/phm_core"
          scripts/check_core_consumer.sh "$RUNNER_TEMP/phm_core"
      - name: Benchmark metrics reproduce the committed results
        run: scripts/check_benchmark_reproduces.sh build/standalone/benchmark/phm_benchmark

  colcon:
    name: colcon build and test (ros:humble)
    runs-on: ubuntu-latest
    container:
      image: ros:humble
    steps:
      - uses: actions/checkout@v5
      - name: Resolve declared dependencies with rosdep
        # Fails on any package.xml key that is not a real rosdep key.
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          apt-get update
          rosdep update --rosdistro humble
          rosdep install --from-paths src integrations --ignore-src -y --rosdistro humble
      - name: Build all packages
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release
      - name: Install overlay smoke
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE/scripts/check_install_overlay.sh"
      - name: Run package tests (gtest on live rclcpp graphs, cpplint, xmllint)
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --return-code-on-test-failure
          colcon test-result --verbose
